<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma liste de courses</title>
<meta name="theme-color" content="#2F6B4F">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#EEF1EC;--card:#fff;--ink:#16261F;--mute:#66756D;--line:#D9E0DA;--accent:#2F6B4F;--tag:#E8B931;--danger:#B3412F}
@media(prefers-color-scheme:dark){:root{--bg:#121A16;--card:#1B2620;--ink:#E8EFEA;--mute:#93A39A;--line:#2C3A32;--accent:#5DB58A;--tag:#E8B931;--danger:#E07A66}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 96px)}
main{max-width:560px;margin:0 auto;padding:20px 16px}
h1{font-size:26px;margin:0 0 16px;letter-spacing:-.02em}
form{display:grid;grid-template-columns:1fr 92px 64px;gap:8px;margin-bottom:8px}
input{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
form button{grid-column:1/-1;font:inherit;font-weight:600;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px;cursor:pointer}
ul{list-style:none;margin:16px 0 0;padding:0}
li{display:grid;grid-template-columns:28px 1fr auto 32px;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
li.done .nom{text-decoration:line-through;color:var(--mute)}
li input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);padding:0}
.nom small{display:block;color:var(--mute);font-size:13px}
.prix{background:var(--tag);color:#2A2200;border:0;border-radius:6px;padding:5px 9px;font:600 15px system-ui;font-variant-numeric:tabular-nums;cursor:pointer}
.prix.vide{background:transparent;border:1px dashed var(--mute);color:var(--mute)}
.sup{background:none;border:0;color:var(--mute);font-size:20px;cursor:pointer;border-radius:6px}
.sup:hover{color:var(--danger)}
.vide-msg{text-align:center;color:var(--mute);padding:32px 0}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.tot{max-width:560px;margin:0 auto;display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-variant-numeric:tabular-nums}
.tot b{font-size:24px}
.tot span{color:var(--mute);font-size:14px}
.clear{background:none;border:0;color:var(--accent);font:600 14px system-ui;cursor:pointer;padding:6px 0}
</style>
</head>
<body>
<main>
  <h1>Ma liste de courses</h1>
  <form id="f" autocomplete="off">
    <input id="nom" placeholder="Article (ex. lait)" required aria-label="Article">
    <input id="prix" type="number" inputmode="decimal" step="0.01" min="0" placeholder="Prix €" aria-label="Prix en euros">
    <input id="qte" type="number" inputmode="numeric" min="1" value="1" aria-label="Quantité">
    <button>Ajouter à la liste</button>
  </form>
  <ul id="liste"></ul>
</main>
<footer>
  <div class="tot">
    <div><span>Total de la liste</span><br><b id="total">0,00 €</b></div>
    <div style="text-align:right"><span id="pris">Dans le panier : 0,00 €</span><br><button class="clear" id="clear">Retirer les articles cochés</button></div>
  </div>
</footer>
<script>
const KEY='courses-v1';
let items=[];
try{items=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}
const $=id=>document.getElementById(id);
const eur=n=>n.toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}};

function render(){
  const ul=$('liste'); ul.innerHTML='';
  if(!items.length){ul.innerHTML='<p class="vide-msg">La liste est vide. Ajoutez votre premier article ci-dessus.</p>'}
  items.forEach((it,i)=>{
    const li=document.createElement('li'); if(it.done)li.className='done';
    const total=(it.prix||0)*it.qte;
    li.innerHTML=`<input type="checkbox" ${it.done?'checked':''} aria-label="Cocher ${esc(it.nom)}">
      <div class="nom">${esc(it.nom)}<small>${it.qte>1?'× '+it.qte+(it.prix!=null?' · '+eur(it.prix)+' pièce':''):''}</small></div>
      <button class="prix ${it.prix==null?'vide':''}" aria-label="Modifier le prix">${it.prix==null?'+ prix':eur(total)}</button>
      <button class="sup" aria-label="Supprimer ${esc(it.nom)}">×</button>`;
    li.children[0].onchange=e=>{it.done=e.target.checked;save();render()};
    li.children[2].onclick=()=>{
      const v=prompt('Prix unitaire de « '+it.nom+' » (€)',it.prix??'');
      if(v===null)return;
      const n=parseFloat(v.replace(',','.'));
      it.prix=isNaN(n)?null:Math.max(0,n);save();render();
    };
    li.children[3].onclick=()=>{items.splice(i,1);save();render()};
    ul.appendChild(li);
  });
  const sum=l=>l.reduce((s,x)=>s+(x.prix||0)*x.qte,0);
  $('total').textContent=eur(sum(items));
  $('pris').textContent='Dans le panier : '+eur(sum(items.filter(x=>x.done)));
}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

$('f').onsubmit=e=>{
  e.preventDefault();
  const p=parseFloat($('prix').value.replace(',','.'));
  items.unshift({nom:$('nom').value.trim(),prix:isNaN(p)?null:p,qte:Math.max(1,parseInt($('qte').value)||1),done:false});
  save();render();
  $('nom').value='';$('prix').value='';$('qte').value=1;$('nom').focus();
};
$('clear').onclick=()=>{
  if(items.some(x=>x.done)&&confirm('Retirer les articles cochés de la liste ?')){items=items.filter(x=>!x.done);save();render()}
};
render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
</script>
</body>
</html>
