<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma liste de courses</title>
<meta name="theme-color" content="#121A16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Courses">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#EEF1EC;--card:#fff;--ink:#16261F;--mute:#66756D;--line:#D9E0DA;--accent:#2F6B4F;--tag:#E8B931;--danger:#B3412F}
@media(prefers-color-scheme:dark){:root{--bg:#121A16;--card:#1B2620;--ink:#E8EFEA;--mute:#93A39A;--line:#2C3A32;--accent:#5DB58A;--tag:#E8B931;--danger:#E07A66}}
*{box-sizing:border-box}
html{background:var(--bg);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 150px)}
main{max-width:560px;margin:0 auto;padding:20px 16px}
.entete{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.entete-actions{display:flex;gap:8px;align-items:center}
h1{font-size:26px;margin:0;letter-spacing:-.02em}
.gear{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;width:42px;height:42px;display:grid;place-items:center;cursor:pointer}
.gear svg{width:22px;height:22px}
h2{font-size:17px;margin:0 0 10px}
form{display:grid;grid-template-columns:1fr 80px 52px 80px;gap:8px;margin-bottom:8px}
input,select{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
input:focus,select:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ligne2{grid-column:1/-1;display:flex;gap:8px}
.ajouter{flex:1;font:inherit;font-weight:600;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px;cursor:pointer}
.photo-btn{flex:none;display:flex;align-items:center;gap:6px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;cursor:pointer}
.photo-btn[hidden]{display:none}
.photo-btn img{width:32px;height:32px;border-radius:6px;object-fit:cover}
.nom{display:flex;align-items:center;gap:10px;min-width:0}
.nom span{min-width:0;overflow-wrap:anywhere}
.nom img,.vignette{width:40px;height:40px;border-radius:8px;object-fit:cover;flex:none}
.vignette{background:var(--bg);border:1px dashed var(--mute);color:var(--mute);font-size:18px;cursor:pointer;padding:0;display:grid;place-items:center;overflow:hidden}
.vignette img{width:100%;height:100%;border-radius:0}
li.done .nom img{opacity:.5}
#photo-dlg .maj{display:block;width:100%;margin-bottom:8px}
#photo-grand{cursor:zoom-out;display:block;width:100%;max-width:280px;aspect-ratio:1;object-fit:cover;border-radius:12px;margin:0 auto 14px}
.nom img{cursor:zoom-in}
#zoom{padding:0;border:0;background:transparent;max-width:92vw;overflow:visible}
#zoom::backdrop{background:rgba(0,0,0,.75)}
#zoom img{display:block;max-width:92vw;max-height:80vh;border-radius:14px;cursor:zoom-out}
ul{list-style:none;margin:16px 0 0;padding:0}
li{display:grid;grid-template-columns:28px 1fr auto 32px;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;border-left:4px solid transparent}
li.done .nom{text-decoration:line-through;color:var(--mute)}
li input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);padding:0}
.nom small{display:block;color:var(--mute);font-size:13px}
.prix{background:var(--tag);color:#2A2200;border:0;border-radius:6px;padding:5px 9px;font:600 15px system-ui;font-variant-numeric:tabular-nums;cursor:pointer}
.prix.vide{background:transparent;border:1px dashed var(--mute);color:var(--mute)}
.sup{background:none;border:0;color:var(--mute);font-size:20px;cursor:pointer;border-radius:6px}
.sup:hover{color:var(--danger)}
.vide-msg{text-align:center;color:var(--mute);padding:24px 0}
#panneau{max-width:560px;margin:0 auto 8px;max-height:45vh;overflow-y:auto}
#panneau ul{margin:0}
#panneau li{grid-template-columns:1fr auto 32px 36px 36px 32px;background:var(--bg);gap:6px}
.cat-btn{width:100%;max-width:560px;margin:0 auto 8px;display:flex;justify-content:space-between;align-items:center;font:600 15px system-ui;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer}
.ajout,.moins{background:var(--accent);color:#fff;border:0;border-radius:8px;width:36px;height:32px;font-size:20px;cursor:pointer}
.moins{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.moins:disabled{opacity:.35;cursor:default}
dialog{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(92vw,360px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog p{margin:0 0 12px;color:var(--mute);font-size:14px}
.fermer{font:600 14px system-ui;background:none;border:0;color:var(--accent);cursor:pointer;padding:8px 0 0}
.maj{font:600 14px system-ui;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.tot{max-width:560px;margin:0 auto;display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-variant-numeric:tabular-nums}
.tot b{font-size:24px}
.tot span{color:var(--mute);font-size:14px}
.clear{background:none;border:0;color:var(--accent);font:600 14px system-ui;cursor:pointer;padding:6px 0}
#rayon{grid-column:1/-1}
li.titre{display:block;background:none;border:0;padding:0;margin:18px 0 6px}
li.titre:first-child{margin-top:0}
li.titre h3{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);display:flex;align-items:center;gap:8px}
.rayon-tag{display:inline-block;margin-top:4px;font:600 12px system-ui;color:var(--accent);background:none;border:1px solid var(--line);border-radius:999px;padding:2px 9px;cursor:pointer}
.rayon-tag.vide{border-style:dashed;color:var(--mute)}
#rayon-dlg .maj{display:block;width:100%;margin-bottom:8px;text-align:left}
#reg-rayons{margin:8px 0 10px}
#reg-rayons li{grid-template-columns:34px 1fr 32px 34px 28px;gap:4px;padding:6px 8px;margin-bottom:6px;border-left:none}
#reg-rayons .rn{min-width:0;overflow-wrap:anywhere;display:flex;align-items:center;gap:8px}
#reg-rayons li.glisse{position:relative;z-index:2;box-shadow:0 6px 18px rgba(0,0,0,.3);border-color:var(--accent)}
.poignee{background:none;border:0;color:var(--mute);font-size:22px;line-height:1;height:32px;width:34px;padding:0;cursor:default;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;opacity:0.3}
.edition-active .poignee{cursor:grab;opacity:1}
.glisse .poignee{cursor:grabbing;color:var(--accent)}
.btn-mini{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;width:34px;height:32px;font-size:14px;cursor:pointer;padding:0}
.input-couleur{-webkit-appearance:none;appearance:none;border:none;width:28px;height:28px;border-radius:6px;cursor:pointer;background:none;padding:0}
.input-couleur::-webkit-color-swatch-wrapper{padding:0}
.input-couleur::-webkit-color-swatch{border:1px solid var(--line);border-radius:6px}
.ligne-add{display:flex;gap:8px;margin-bottom:18px}
.ligne-add input{flex:1}

/* Mode Magasin / Plein écran */
#quitter-magasin{display:none}
body.mode-magasin form, body.mode-magasin footer{display:none!important}
body.mode-magasin #liste li{padding:16px;font-size:1.15rem}
body.mode-magasin #liste input[type=checkbox]{width:32px;height:32px}
body.mode-magasin .nom img, body.mode-magasin .vignette{width:52px;height:52px}
body.mode-magasin .prix{font-size:1.1rem;padding:8px 12px}
body.mode-magasin #quitter-magasin{display:block;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:1000;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:14px 28px;font:600 16px system-ui;box-shadow:0 6px 20px rgba(0,0,0,0.4);cursor:pointer}
</style>
</head>
<body>
<main>
  <div class="entete">
    <h1>Ma liste de courses</h1>
    <div class="entete-actions">
      <button class="gear" id="ouvrir-magasin" aria-label="Mode Magasin">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      </button>
      <button class="gear" id="ouvrir-reg" aria-label="Paramètres">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l-.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </div>
  <form id="f" autocomplete="off">
    <input id="nom" list="suggestions" placeholder="Article (ex. lait)" required aria-label="Article">
    <datalist id="suggestions"></datalist>
    <input id="prix" type="number" inputmode="decimal" step="0.01" min="0" placeholder="Prix €" aria-label="Prix en euros">
    <input id="qte" type="number" inputmode="numeric" min="1" value="1" aria-label="Quantité">
    <input id="unite" placeholder="Format (ex. 500g)" aria-label="Format ou unité">
    <select id="rayon" aria-label="Rayon"></select>
    <div class="ligne2">
      <button type="button" class="photo-btn" id="photo-btn">📷 Photo</button>
      <button type="button" class="photo-btn" id="photo-x" hidden aria-label="Retirer la photo">×</button>
      <button class="ajouter">Ajouter à la liste</button>
    </div>
    <input type="file" id="fichier" accept="image/*" capture="environment" hidden>
  </form>
  <ul id="liste"></ul>
</main>
<button id="quitter-magasin">Quitter le mode Magasin</button>
<dialog id="reglages" aria-labelledby="reg-titre">
  <h2 id="reg-titre">Paramètres</h2>
  <p>Version de l'app : <b id="version"></b></p>
  <h2>Ordre des rayons</h2>
  <p>Classez-les dans l'ordre de votre magasin et personnalisez leurs couleurs.</p>
  <ul id="reg-rayons"></ul>
  <div id="zone-centre-ordre" style="margin:16px 0;text-align:center"></div>
  <div class="ligne-add">
    <input id="rayon-nouveau" placeholder="Nouveau rayon" enterkeyhint="done" aria-label="Nom du nouveau rayon">
    <button class="maj" id="rayon-ajouter">Ajouter</button>
  </div>
  <button class="maj" id="installer">Installer l'app</button>
  <p id="install-etat" role="status" style="margin:8px 0 14px"></p>
  <button class="maj" id="maj">Forcer la mise à jour</button>
  <p id="maj-etat" role="status" style="margin:10px 0 0"></p>
  <button class="fermer" id="fermer-reg">Fermer</button>
</dialog>
<dialog id="photo-dlg" aria-labelledby="photo-titre">
  <h2 id="photo-titre">Photo</h2>
  <img id="photo-grand" alt="">
  <button class="maj" id="p-nouvelle">Prendre une nouvelle photo</button>
  <button class="maj" id="p-suppr">Supprimer la photo</button>
  <button class="fermer" id="p-fermer">Annuler</button>
</dialog>
<dialog id="rayon-dlg" aria-labelledby="rayon-titre">
  <h2 id="rayon-titre">Rayon</h2>
  <div id="rayon-choix"></div>
  <button class="fermer" id="rayon-fermer">Annuler</button>
</dialog>
<dialog id="zoom" aria-label="Photo agrandie"><img id="zoom-img" alt=""></dialog>
<footer>
  <div id="panneau" hidden><ul id="catalogue"></ul></div>
  <button class="cat-btn" id="cat-titre" aria-expanded="false" aria-controls="panneau"><span id="cat-txt">Mes produits enregistrés</span><span id="cat-fl" aria-hidden="true">▲</span></button>
  <div class="tot">
    <div><span>Total de la liste</span><br><b id="total">0,00 €</b></div>
    <div style="text-align:right"><span id="pris">Dans le panier : 0,00 €</span><br><button class="clear" id="clear">Retirer les articles cochés</button></div>
  </div>
</footer>
<script>
const VERSION='1.6.0';
let invite=null,surInvite=null;
let editionOrdreActive=false;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();invite=e;if(surInvite)surInvite()});
addEventListener('appinstalled',()=>{invite=null;majInstall()});
const KEY='courses-v1', CK='courses-catalogue-v1', RK='courses-rayons-v1', RCK='courses-rayons-couleurs-v1';
const DEFAUT=['Fruits et légumes','Boulangerie','Boucherie / Poissonnerie','Produits frais','Surgelés','Épicerie','Boissons','Hygiène / Entretien','Autre'];
const PALETTE_DEFAUT=['#2E7D32','#E65100','#C62828','#0277BD','#00838F','#6A1B9A','#AD1457','#4E342E','#37474F','#00695C','#8D6E63','#558B2F'];

const $=id=>document.getElementById(id);
const load=k=>{try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}};
let items=load(KEY), cat=load(CK);
let rayons=(()=>{try{const v=JSON.parse(localStorage.getItem(RK));if(Array.isArray(v))return v}catch(e){}return DEFAUT.slice()})();
let couleursRayons=(()=>{try{const v=JSON.parse(localStorage.getItem(RCK));if(v&&typeof v==='object')return v}catch(e){}return{}})();

const couleurRayon=nom=>{
  if(!nom) return 'var(--line)';
  if(couleursRayons[nom]) return couleursRayons[nom];
  let idx = rayons.indexOf(nom);
  if(idx === -1){
    let h=0; for(let i=0;i<nom.length;i++) h=nom.charCodeAt(i)+((h<<5)-h);
    idx = Math.abs(h);
  }
  return PALETTE_DEFAUT[idx % PALETTE_DEFAUT.length];
};

const save=()=>{try{
  localStorage.setItem(KEY,JSON.stringify(items));
  localStorage.setItem(CK,JSON.stringify(cat));
  localStorage.setItem(RK,JSON.stringify(rayons));
  localStorage.setItem(RCK,JSON.stringify(couleursRayons));
}catch(e){}};

const eur=n=>n.toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
const norm=s=>s.trim().toLowerCase();
let photoEnCours=null,cible=null;
const find=n=>cat.find(c=>norm(c.nom)===norm(n));
const toNum=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:Math.max(0,n)};
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function remember(nom,prix,photo,rayon,unite){
  const c=find(nom);
  if(c){if(prix!=null)c.prix=prix;if(photo)c.photo=photo;if(rayon!==undefined)c.rayon=rayon||null;if(unite!==undefined)c.unite=unite||''}
  else if(prix!=null||photo||rayon||unite)cat.push({nom:nom.trim(),prix:prix??null,photo:photo||null,rayon:rayon||null,unite:unite||''});
}
items.forEach(i=>remember(i.nom,i.prix,undefined,undefined,i.unite));

const rayonDe=nom=>{const c=find(nom);return c&&c.rayon&&rayons.includes(c.rayon)?c.rayon:''};
const tagRayon=nom=>{
  const r=rayonDe(nom);
  const coul=couleurRayon(r);
  const style = r ? `style="color:${coul};border-color:${coul}"` : '';
  return `<button class="rayon-tag ${r?'':'vide'}" ${style} aria-label="Rayon de ${esc(nom)} : ${r?esc(r):'aucun'}. Modifier">${r?esc(r):'+ rayon'}</button>`;
};
function setRayon(nom,r){const it=items.find(i=>norm(i.nom)===norm(nom));remember(nom,it?it.prix:undefined,null,r,it?it.unite:undefined)}
let rayonNom=null;
function ouvrirRayon(nom){
  rayonNom=nom;
  const cur=rayonDe(nom), box=$('rayon-choix'); box.innerHTML='';$('rayon-titre').textContent=nom;
  [''].concat(rayons).forEach(r=>{
    const b=document.createElement('button'); b.className='maj';
    const c=couleurRayon(r);
    b.innerHTML=(r===cur?'✓ ':'')+`<span class="input-couleur" style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${c};vertical-align:middle;margin-right:6px"></span> `+(r||'Sans rayon');
    b.onclick=()=>{setRayon(rayonNom,r);$('rayon-dlg').close();save();render()};
    box.appendChild(b);
  });
  $('rayon-dlg').showModal();
}
function fillSelect(){
  const s=$('rayon'), v=s.value; s.innerHTML='';
  [''].concat(rayons).forEach(r=>{const o=document.createElement('option');o.value=r;o.textContent=r||'Rayon (facultatif)';s.appendChild(o)});
  s.value=rayons.includes(v)?v:'';
}

function addItem(nom,prix,qte,unite){
  const ex=items.find(i=>norm(i.nom)===norm(nom));
  if(ex){ex.qte+=qte;ex.done=false;if(prix!=null)ex.prix=prix;if(unite)ex.unite=unite}
  else items.unshift({nom:nom.trim(),prix,qte,unite:unite||'',done:false});
}

function render(){
  const ul=$('liste'); ul.innerHTML='';
  if(!items.length)ul.innerHTML='<p class="vide-msg">La liste est vide. Ajoutez un article ci-dessus ou choisissez-en dans « Mes produits enregistrés ».</p>';
  const groupes=rayons.map(n=>({nom:n,l:[]})); groupes.push({nom:'',l:[]});
  items.forEach(it=>{const r=rayonDe(it.nom);(groupes.find(g=>g.nom===r)||groupes[groupes.length-1]).l.push(it)});
  groupes.forEach(g=>{
    if(!g.l.length)return;
    g.l.sort((a,b)=>Number(!!a.done)-Number(!!b.done));
    const t=document.createElement('li'); t.className='titre';
    const coul=couleurRayon(g.nom);
    t.innerHTML=`<h3><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${coul}"></span>${esc(g.nom||'Sans rayon')} · ${g.l.length}</h3>`;
    ul.appendChild(t);
    g.l.forEach(it=>{
      const li=document.createElement('li'); if(it.done)li.className='done';
      if(g.nom) li.style.borderLeftColor = coul;
      const total=(it.prix||0)*it.qte;
      const cc=find(it.nom), img=cc&&cc.photo?`<img src="${cc.photo}" alt="">`:'';
      const detailQte=it.qte>1 || it.unite ? `× ${it.qte}${it.unite?' '+esc(it.unite):''}${it.prix!=null?' · '+eur(it.prix)+' pièce':''}` : '';
      li.innerHTML=`<input type="checkbox" ${it.done?'checked':''} aria-label="Cocher ${esc(it.nom)}">
        <div class="nom">${img}<span>${esc(it.nom)}<small>${detailQte}</small>${tagRayon(it.nom)}</span></div>
        <button class="prix ${it.prix==null?'vide':''}" aria-label="Modifier le prix">${it.prix==null?'+ prix':eur(total)}</button>
        <button class="sup" aria-label="Retirer ${esc(it.nom)} de la liste">×</button>`;
      li.children[0].onchange=e=>{it.done=e.target.checked;save();render()};
      const im=li.querySelector('.nom img'); if(im)im.onclick=()=>agrandir(cc.photo,it.nom);
      li.querySelector('.rayon-tag').onclick=()=>ouvrirRayon(it.nom);
      li.children[2].onclick=()=>{
        const v=prompt('Nouveau prix unitaire de « '+it.nom+' » (€)',it.prix??'');
        if(v===null)return;
        it.prix=toNum(v); remember(it.nom,it.prix,undefined,undefined,it.unite); save(); render();
      };
      li.children[3].onclick=()=>{items.splice(items.indexOf(it),1);save();render()};
      ul.appendChild(li);
    });
  });
  const sum=l=>l.reduce((s,x)=>s+(x.prix||0)*x.qte,0);
  $('total').textContent=eur(sum(items));$('pris').textContent='Dans le panier : '+eur(sum(items.filter(x=>x.done)));
  fillSelect();renderRayons();renderCat();
}

function renderRayons(){
  const ul=$('reg-rayons'); ul.innerHTML='';
  if(editionOrdreActive) ul.classList.add('edition-active'); else ul.classList.remove('edition-active');
  
  const zone=$('zone-centre-ordre');
  zone.innerHTML='';
  const btnToggle=document.createElement('button');
  btnToggle.className='maj';
  btnToggle.style.cssText='background:var(--line);font-weight:600;padding:12px 20px;width:100%;cursor:pointer';
  btnToggle.textContent=editionOrdreActive ? '✓ Terminer' : '↕ Modifier l\'ordre des rayons';
  btnToggle.onclick=()=>{
    editionOrdreActive=!editionOrdreActive;
    renderRayons();
  };
  zone.appendChild(btnToggle);

  if(!rayons.length)ul.innerHTML='<p class="vide-msg" style="padding:8px 0">Aucun rayon. Ajoutez-en un ci-dessous.</p>';
  rayons.forEach((n,i)=>{
    const li=document.createElement('li');
    li.dataset.nom=n;
    const coul=couleurRayon(n);
    li.innerHTML=`<button class="poignee" aria-label="Déplacer ${esc(n)} : maintenir et glisser">⠿</button>
      <span class="rn"><input type="color" class="input-couleur" value="${coul}" aria-label="Couleur de ${esc(n)}">${esc(n)}</span>
      <button class="btn-mini" aria-label="Renommer ${esc(n)}">✎</button>
      <button class="sup" aria-label="Supprimer le rayon ${esc(n)}">×</button>`;
    const b=li.querySelectorAll('button');
    const inpColor=li.querySelector('input[type="color"]');
    inpColor.oninput=e=>{
      couleursRayons[n]=e.target.value;
      save();
    };
    inpColor.onchange=()=>render();
    
    b[0].addEventListener('pointerdown',e=>{
      if(!editionOrdreActive) return;
      glisser(e,li);
    });
    b[1].onclick=()=>renommer(i);
    b[2].onclick=()=>supprimer(i);
    ul.appendChild(li);
  });
}

function glisser(e,li){
  if(e.button>0)return;
  e.preventDefault();
  const ul=li.parentNode, h=e.currentTarget, dlg=$('reglages');
  const grab=e.clientY-li.getBoundingClientRect().top;
  let y=e.clientY, raf=0;
  try{h.setPointerCapture(e.pointerId)}catch(_){}
  li.classList.add('glisse');
  const place=()=>{
    li.style.transform='';
    let ref=null;
    for(const s of ul.children){
      if(s===li)continue;
      const r=s.getBoundingClientRect();
      if(y<r.top+r.height/2){ref=s;break}
    }
    if(li.nextElementSibling!==ref)ul.insertBefore(li,ref);
    li.style.transform=`translateY(${y-grab-li.getBoundingClientRect().top}px)`;
  };
  const defile=()=>{
    const r=dlg.getBoundingClientRect();
    if(y<r.top+50)dlg.scrollTop-=10; else if(y>r.bottom-50)dlg.scrollTop+=10;
    place(); raf=requestAnimationFrame(defile);
  };
  const bouge=ev=>{y=ev.clientY};
  const fin=()=>{
    cancelAnimationFrame(raf);
    window.removeEventListener('pointermove',bouge);
    window.removeEventListener('pointerup',fin);
    window.removeEventListener('pointercancel',fin);
    const ordre=[...ul.children].map(x=>x.dataset.nom);
    if(ordre.length===rayons.length&&ordre.some((n,k)=>n!==rayons[k])){rayons=ordre;save()}
    render();
  };
  window.addEventListener('pointermove',bouge);
  window.addEventListener('pointerup',fin);
  window.addEventListener('pointercancel',fin);
  defile();
}

function renommer(i){
  const v=prompt('Nouveau nom du rayon',rayons[i]); if(v===null)return;
  const n=v.trim(), old=rayons[i];
  if(!n||(norm(n)!==norm(old)&&rayons.some(r=>norm(r)===norm(n))))return;
  cat.forEach(c=>{if(c.rayon===old)c.rayon=n});
  if(couleursRayons[old]){couleursRayons[n]=couleursRayons[old];delete couleursRayons[old]}
  rayons[i]=n; save(); render();
}
function supprimer(i){
  const old=rayons[i];
  if(!confirm('Supprimer le rayon « '+old+' » ? Ses produits passeront en « Sans rayon ».'))return;
  cat.forEach(c=>{if(c.rayon===old)c.rayon=null});
  delete couleursRayons[old];
  rayons.splice(i,1); save(); render();
}
function ajouterRayon(){
  const inp=$('rayon-nouveau'), n=inp.value.trim(); if(!n)return;
  if(!rayons.some(r=>norm(r)===norm(n))){rayons.push(n);save();render()}
  inp.value='';
}
$('rayon-ajouter').onclick=ajouterRayon;
$('rayon-nouveau').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();ajouterRayon()}});$('rayon-fermer').onclick=()=>{$('reglages').close();editionOrdreActive=false;};$('reglages').addEventListener('click',e=>{if(e.target===$('reglages')){$('reglages').close();editionOrdreActive=false;}});

function renderCat(){
  cat.sort((a,b)=>a.nom.localeCompare(b.nom,'fr'));
  $('cat-txt').textContent='Mes produits enregistrés ('+cat.length+')';
  const dl=$('suggestions'); dl.innerHTML='';
  cat.forEach(c=>{const o=document.createElement('option');o.value=c.nom;dl.appendChild(o)});
  const ul=$('catalogue'); ul.innerHTML='';
  if(!cat.length)ul.innerHTML='<p class="vide-msg">Aucun produit pour l\'instant. Ceux que vous ajoutez avec un prix sont enregistrés ici.</p>';
  cat.forEach(c=>{
    const li=document.createElement('li');
    const ex=items.find(i=>norm(i.nom)===norm(c.nom));
    const vig=c.photo?`<img src="${c.photo}" alt="">`:'📷';
    li.innerHTML=`<div class="nom"><button class="vignette" aria-label="Photo de ${esc(c.nom)}">${vig}</button><span>${esc(c.nom)}<small>${ex?'Dans la liste : × '+ex.qte+(ex.unite?' '+ex.unite:''):''}</small>${tagRayon(c.nom)}</span></div>
      <button class="prix ${c.prix==null?'vide':''}" aria-label="Modifier le prix de ${esc(c.nom)}">${c.prix==null?'+ prix':eur(c.prix)}</button>
      <button class="btn-mini" aria-label="Renommer ${esc(c.nom)}">✎</button>
      <button class="moins" aria-label="Retirer un ${esc(c.nom)}" ${ex&&ex.qte>1?'':'disabled'}>−</button>
      <button class="ajout" aria-label="Ajouter ${esc(c.nom)} à la liste">+</button>
      <button class="sup" aria-label="Supprimer ${esc(c.nom)} des produits enregistrés">×</button>`;
    li.children[1].onclick=()=>{
      const v=prompt('Nouveau prix de « '+c.nom+' » (€)',c.prix??'');
      const n=v===null?null:toNum(v); if(n===null)return;
      c.prix=n; items.filter(i=>norm(i.nom)===norm(c.nom)).forEach(i=>i.prix=n); save(); render();
    };
    li.children[2].onclick=()=>{
      const v=prompt('Nouveau nom du produit',c.nom); if(v===null)return;
      const n=v.trim();
      if(!n||(norm(n)!==norm(c.nom)&&cat.some(x=>norm(x.nom)===norm(n))))return;
      const old=c.nom; c.nom=n;
      items.filter(i=>norm(i.nom)===norm(old)).forEach(i=>i.nom=n);
      save(); render();
    };
    li.children[3].onclick=()=>{if(ex&&ex.qte>1){ex.qte--;save();render()}};
    li.children[4].onclick=()=>{addItem(c.nom,c.prix,1,c.unite);save();render()};
    li.children[5].onclick=()=>{if(confirm('Supprimer « '+c.nom+' » des produits enregistrés ?')){cat=cat.filter(x=>x!==c);save();render()}};
    li.querySelector('.rayon-tag').onclick=()=>ouvrirRayon(c.nom);
    li.querySelector('.vignette').onclick=()=>{
      cible=c;
      if(c.photo){$('photo-titre').textContent=c.nom;$('photo-grand').src=c.photo;$('photo-grand').alt=c.nom;$('photo-dlg').showModal()}else$('fichier').click();
    };
    ul.appendChild(li);
  });
}

$('nom').addEventListener('input',()=>{
  const c=find($('nom').value);$('prix').placeholder=c&&c.prix!=null?eur(c.prix)+' (enregistré)':'Prix €';
  if(c){
    if(c.rayon)$('rayon').value=rayonDe(c.nom);
    if(c.unite)$('unite').value=c.unite;
  }
});

$('f').onsubmit=e=>{
  e.preventDefault();
  const nom=$('nom').value.trim(), c=find(nom);
  let p=toNum($('prix').value);
  if(p===null&&c)p=c.prix;
  const unite=$('unite').value.trim();
  remember(nom,p,photoEnCours,$('rayon').value,unite);
  addItem(nom,p,Math.max(1,parseInt($('qte').value)||1),unite);
  save();render();
  $('nom').value='';$('prix').value='';$('qte').value=1;$('unite').value='';$('rayon').value='';$('prix').placeholder='Prix €';$('nom').focus();
  photoEnCours=null;majPhoto();
};
$('clear').onclick=()=>{
  if(items.some(x=>x.done)&&confirm('Retirer les articles cochés de la liste ? Ils restent dans vos produits enregistrés.')){items=items.filter(x=>!x.done);save();render()}
};

function agrandir(src,nom){$('zoom-img').src=src;$('zoom-img').alt=nom;$('zoom').showModal()}
$('zoom').onclick=()=>$('zoom').close();

function miniature(file){
  return new Promise((ok,ko)=>{
    const img=new Image(), u=URL.createObjectURL(file);
    img.onload=()=>{
      const T=400, s=Math.min(img.width,img.height), cv=document.createElement('canvas');
      cv.width=cv.height=T;
      cv.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,T,T);
      URL.revokeObjectURL(u); ok(cv.toDataURL('image/jpeg',0.7));
    };
    img.onerror=()=>{URL.revokeObjectURL(u);ko()};
    img.src=u;
  });
}
function majPhoto(){
  $('photo-btn').innerHTML=photoEnCours?`<img src="${photoEnCours}" alt="">Photo`:'📷 Photo';
  $('photo-x').hidden=!photoEnCours;
}
$('photo-btn').onclick=()=>{cible=null;$('fichier').click()};
$('photo-x').onclick=()=>{photoEnCours=null;majPhoto()};$('fichier').onchange=async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f)return;
  try{
    const d=await miniature(f);
    if(cible){cible.photo=d;cible=null;save();render()}
    else{photoEnCours=d;majPhoto()}
  }catch(_){alert("Cette photo n'a pas pu être lue. Réessayez.")}
};
$('p-nouvelle').onclick=()=>{$('photo-dlg').close();$('fichier').click()};$('p-suppr').onclick=()=>{if(cible){cible.photo=null;cible=null;save();render()}$('photo-dlg').close()};$('p-fermer').onclick=()=>{cible=null;$('photo-dlg').close()};$('photo-grand').onclick=()=>{cible=null;$('photo-dlg').close()};$('photo-dlg').addEventListener('click',e=>{
  const r=e.currentTarget.getBoundingClientRect();
  if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom){cible=null;e.currentTarget.close()}
});

// Mode Magasin
$('ouvrir-magasin').onclick=()=>document.body.classList.add('mode-magasin');$('quitter-magasin').onclick=()=>document.body.classList.remove('mode-magasin');

// Paramètres
$('version').textContent='v'+VERSION;
$('cat-titre').onclick=()=>{
  const p=$('panneau'),ouvrir=p.hidden;
  p.hidden=!ouvrir;$('cat-titre').setAttribute('aria-expanded',ouvrir);$('cat-fl').textContent=ouvrir?'▼':'▲';
};
const dejaInstallee=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function majInstall(){
  const b=$('installer'),t=$('install-etat');
  if(dejaInstallee()){b.disabled=true;t.textContent="L'app est déjà installée sur cet appareil."}
  else{b.disabled=false;t.textContent=''}
}
$('installer').onclick=async()=>{
  const t=$('install-etat'), ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(!invite&&!ios){
    t.textContent='Préparation…';
    await new Promise(r=>{surInvite=r;setTimeout(r,2500)}); surInvite=null;
  }
  if(invite){
    invite.prompt();
    const r=await invite.userChoice; invite=null;
    t.textContent=r.outcome==='accepted'?'Installation lancée.':'Installation annulée.';
  }else{
    t.textContent=ios?"Sur iPhone : Partager, puis « Sur l'écran d'accueil »."
      :"Installation directe indisponible pour l'instant. Rechargez l'app puis réessayez.";
  }
};
$('ouvrir-reg').onclick=()=>{majInstall();$('reglages').showModal()};
$('fermer-reg').onclick=()=>{$('reglages').close();editionOrdreActive=false;};
$('reglages').addEventListener('click',e=>{if(e.target===$('reglages')){$('reglages').close();editionOrdreActive=false;}});$('maj').onclick=async()=>{
  const etat=$('maj-etat'); etat.textContent='Mise à jour en cours…';
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    await Promise.all(['./','index.html','manifest.json','sw.js'].map(u=>fetch(u,{cache:'reload'}).catch(()=>{})));
    etat.textContent='Terminé, rechargement…';
    setTimeout(()=>location.replace(location.pathname+'?maj='+Date.now()),400);
  }catch(e){etat.textContent='La mise à jour a échoué. Vérifiez votre connexion et réessayez.'}
};

save();render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
</script>
