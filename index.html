<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma liste de courses</title>
<meta name="theme-color" content="#2F6B4F">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#EEF1EC;--card:#fff;--ink:#16261F;--mute:#66756D;--line:#D9E0DA;--accent:#2F6B4F;--tag:#E8B931;--danger:#B3412F}
@media(prefers-color-scheme:dark){:root{--bg:#121A16;--card:#1B2620;--ink:#E8EFEA;--mute:#93A39A;--line:#2C3A32;--accent:#5DB58A;--tag:#E8B931;--danger:#E07A66}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 150px)}
main{max-width:560px;margin:0 auto;padding:20px 16px}
.entete{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
h1{font-size:26px;margin:0;letter-spacing:-.02em}
.gear{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;width:42px;height:42px;display:grid;place-items:center;cursor:pointer}
.gear svg{width:22px;height:22px}
h2{font-size:17px;margin:0 0 10px}
form{display:grid;grid-template-columns:1fr 92px 64px;gap:8px;margin-bottom:8px}
input{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
input:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
form button{grid-column:1/-1;font:inherit;font-weight:600;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px;cursor:pointer}
ul{list-style:none;margin:16px 0 0;padding:0}
li{display:grid;grid-template-columns:28px 1fr auto 32px;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
li.done .nom{text-decoration:line-through;color:var(--mute)}
li input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);padding:0}
.nom small{display:block;color:var(--mute);font-size:13px}
.prix{background:var(--tag);color:#2A2200;border:0;border-radius:6px;padding:5px 9px;font:600 15px system-ui;font-variant-numeric:tabular-nums;cursor:pointer}
.prix.vide{background:transparent;border:1px dashed var(--mute);color:var(--mute)}
.sup{background:none;border:0;color:var(--mute);font-size:20px;cursor:pointer;border-radius:6px}
.sup:hover{color:var(--danger)}
.vide-msg{text-align:center;color:var(--mute);padding:24px 0}
#panneau{max-width:560px;margin:0 auto 8px;max-height:45vh;overflow-y:auto}
#panneau ul{margin:0}
#panneau li{grid-template-columns:1fr auto 36px 32px;background:var(--bg)}
.cat-btn{width:100%;max-width:560px;margin:0 auto 8px;display:flex;justify-content:space-between;align-items:center;font:600 15px system-ui;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer}
.ajout{background:var(--accent);color:#fff;border:0;border-radius:8px;width:36px;height:32px;font-size:20px;cursor:pointer}
dialog{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(92vw,360px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog p{margin:0 0 12px;color:var(--mute);font-size:14px}
.fermer{font:600 14px system-ui;background:none;border:0;color:var(--accent);cursor:pointer;padding:8px 0 0}
.maj{font:600 14px system-ui;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.tot{max-width:560px;margin:0 auto;display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-variant-numeric:tabular-nums}
.tot b{font-size:24px}
.tot span{color:var(--mute);font-size:14px}
.clear{background:none;border:0;color:var(--accent);font:600 14px system-ui;cursor:pointer;padding:6px 0}
</style>
</head>
<body>
<main>
  <div class="entete">
    <h1>Ma liste de courses</h1>
    <button class="gear" id="ouvrir-reg" aria-label="Paramètres">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
  <form id="f" autocomplete="off">
    <input id="nom" list="suggestions" placeholder="Article (ex. lait)" required aria-label="Article">
    <datalist id="suggestions"></datalist>
    <input id="prix" type="number" inputmode="decimal" step="0.01" min="0" placeholder="Prix €" aria-label="Prix en euros">
    <input id="qte" type="number" inputmode="numeric" min="1" value="1" aria-label="Quantité">
    <button>Ajouter à la liste</button>
  </form>
  <ul id="liste"></ul>


  </main>
<dialog id="reglages" aria-labelledby="reg-titre">
  <h2 id="reg-titre">Paramètres</h2>
  <p>Version de l'app : <b id="version"></b></p>
  <button class="maj" id="installer">Installer l'app</button>
  <p id="install-etat" role="status" style="margin:8px 0 14px"></p>
  <button class="maj" id="maj">Forcer la mise à jour</button>
  <p id="maj-etat" role="status" style="margin:10px 0 0"></p>
  <button class="fermer" id="fermer-reg">Fermer</button>
</dialog>
<footer>
  <div id="panneau" hidden><ul id="catalogue"></ul></div>
  <button class="cat-btn" id="cat-titre" aria-expanded="false" aria-controls="panneau"><span id="cat-txt">Mes produits enregistrés</span><span id="cat-fl" aria-hidden="true">▲</span></button>
  <div class="tot">
    <div><span>Total de la liste</span><br><b id="total">0,00 €</b></div>
    <div style="text-align:right"><span id="pris">Dans le panier : 0,00 €</span><br><button class="clear" id="clear">Retirer les articles cochés</button></div>
  </div>
</footer>
<script>
const VERSION='1.3.5';
let invite=null,surInvite=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();invite=e;if(surInvite)surInvite()});
addEventListener('appinstalled',()=>{invite=null;majInstall()});
const KEY='courses-v1', CK='courses-catalogue-v1';
const $=id=>document.getElementById(id);
const load=k=>{try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}};
let items=load(KEY), cat=load(CK);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(items));localStorage.setItem(CK,JSON.stringify(cat))}catch(e){}};
const eur=n=>n.toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
const norm=s=>s.trim().toLowerCase();
const find=n=>cat.find(c=>norm(c.nom)===norm(n));
const toNum=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:Math.max(0,n)};
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

// Mémorise le produit et son dernier prix connu
function remember(nom,prix){
  if(prix==null)return;
  const c=find(nom);
  if(c)c.prix=prix; else cat.push({nom:nom.trim(),prix});
}
items.forEach(i=>remember(i.nom,i.prix)); // reprend les anciennes listes

function addItem(nom,prix,qte){
  const ex=items.find(i=>norm(i.nom)===norm(nom));
  if(ex){ex.qte+=qte;ex.done=false;if(prix!=null)ex.prix=prix}
  else items.unshift({nom:nom.trim(),prix,qte,done:false});
}

function render(){
  const ul=$('liste'); ul.innerHTML='';
  if(!items.length)ul.innerHTML='<p class="vide-msg">La liste est vide. Ajoutez un article ci-dessus ou choisissez-en dans « Mes produits enregistrés ».</p>';
  items.forEach((it,i)=>{
    const li=document.createElement('li'); if(it.done)li.className='done';
    const total=(it.prix||0)*it.qte;
    li.innerHTML=`<input type="checkbox" ${it.done?'checked':''} aria-label="Cocher ${esc(it.nom)}">
      <div class="nom">${esc(it.nom)}<small>${it.qte>1?'× '+it.qte+(it.prix!=null?' · '+eur(it.prix)+' pièce':''):''}</small></div>
      <button class="prix ${it.prix==null?'vide':''}" aria-label="Modifier le prix">${it.prix==null?'+ prix':eur(total)}</button>
      <button class="sup" aria-label="Retirer ${esc(it.nom)} de la liste">×</button>`;
    li.children[0].onchange=e=>{it.done=e.target.checked;save();render()};
    li.children[2].onclick=()=>{
      const v=prompt('Nouveau prix unitaire de « '+it.nom+' » (€)',it.prix??'');
      if(v===null)return;
      it.prix=toNum(v); remember(it.nom,it.prix); save(); render();
    };
    li.children[3].onclick=()=>{items.splice(i,1);save();render()};
    ul.appendChild(li);
  });
  const sum=l=>l.reduce((s,x)=>s+(x.prix||0)*x.qte,0);
  $('total').textContent=eur(sum(items));
  $('pris').textContent='Dans le panier : '+eur(sum(items.filter(x=>x.done)));
  renderCat();
}

function renderCat(){
  cat.sort((a,b)=>a.nom.localeCompare(b.nom,'fr'));
  $('cat-txt').textContent='Mes produits enregistrés ('+cat.length+')';
  const dl=$('suggestions'); dl.innerHTML='';
  cat.forEach(c=>{const o=document.createElement('option');o.value=c.nom;dl.appendChild(o)});
  const ul=$('catalogue'); ul.innerHTML='';
  if(!cat.length)ul.innerHTML='<p class="vide-msg">Aucun produit pour l\'instant. Ceux que vous ajoutez avec un prix sont enregistrés ici.</p>';
  cat.forEach(c=>{
    const li=document.createElement('li');
    li.innerHTML=`<div class="nom">${esc(c.nom)}</div>
      <button class="prix" aria-label="Modifier le prix de ${esc(c.nom)}">${eur(c.prix)}</button>
      <button class="ajout" aria-label="Ajouter ${esc(c.nom)} à la liste">+</button>
      <button class="sup" aria-label="Supprimer ${esc(c.nom)} des produits enregistrés">×</button>`;
    li.children[1].onclick=()=>{
      const v=prompt('Nouveau prix de « '+c.nom+' » (€)',c.prix);
      const n=v===null?null:toNum(v); if(n===null)return;
      c.prix=n; items.filter(i=>norm(i.nom)===norm(c.nom)).forEach(i=>i.prix=n); save(); render();
    };
    li.children[2].onclick=()=>{addItem(c.nom,c.prix,1);save();render()};
    li.children[3].onclick=()=>{if(confirm('Supprimer « '+c.nom+' » des produits enregistrés ?')){cat=cat.filter(x=>x!==c);save();render()}};
    ul.appendChild(li);
  });
}

// Affiche le prix enregistré quand on tape un produit connu
$('nom').addEventListener('input',()=>{
  const c=find($('nom').value);
  $('prix').placeholder=c?eur(c.prix)+' (enregistré)':'Prix €';
});

$('f').onsubmit=e=>{
  e.preventDefault();
  const nom=$('nom').value.trim(), c=find(nom);
  let p=toNum($('prix').value);
  if(p===null&&c)p=c.prix;        // prix vide : reprend le prix enregistré
  remember(nom,p);                // prix différent : mise à jour
  addItem(nom,p,Math.max(1,parseInt($('qte').value)||1));
  save();render();
  $('nom').value='';$('prix').value='';$('qte').value=1;$('prix').placeholder='Prix €';$('nom').focus();
};
$('clear').onclick=()=>{
  if(items.some(x=>x.done)&&confirm('Retirer les articles cochés de la liste ? Ils restent dans vos produits enregistrés.')){items=items.filter(x=>!x.done);save();render()}
};

// Paramètres
$('version').textContent='v'+VERSION;
$('cat-titre').onclick=()=>{
  const p=$('panneau'),ouvrir=p.hidden;
  p.hidden=!ouvrir;$('cat-titre').setAttribute('aria-expanded',ouvrir);$('cat-fl').textContent=ouvrir?'▼':'▲';
};
const dejaInstallee=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function majInstall(){
  const b=$('installer'),t=$('install-etat');
  if(dejaInstallee()){b.disabled=true;t.textContent="L'app est déjà installée sur cet appareil."}
  else{b.disabled=false;t.textContent=''}
}
$('installer').onclick=async()=>{
  const t=$('install-etat'), ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(!invite&&!ios){ // le navigateur peut mettre quelques secondes à proposer l'installation
    t.textContent='Préparation…';
    await new Promise(r=>{surInvite=r;setTimeout(r,2500)}); surInvite=null;
  }
  if(invite){
    invite.prompt();
    const r=await invite.userChoice; invite=null;
    t.textContent=r.outcome==='accepted'?'Installation lancée.':'Installation annulée.';
  }else{
    t.textContent=ios?"Sur iPhone : Partager, puis « Sur l'écran d'accueil »."
      :"Installation directe indisponible pour l'instant. Rechargez l'app puis réessayez.";
  }
};
$('ouvrir-reg').onclick=()=>{majInstall();$('reglages').showModal()};
$('fermer-reg').onclick=()=>$('reglages').close();
$('reglages').addEventListener('click',e=>{if(e.target===$('reglages'))$('reglages').close()});
$('maj').onclick=async()=>{
  const etat=$('maj-etat'); etat.textContent='Mise à jour en cours…';
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    // Recharge les fichiers depuis le réseau, sans toucher à vos listes ni à vos produits
    await Promise.all(['./','index.html','manifest.json','sw.js'].map(u=>fetch(u,{cache:'reload'}).catch(()=>{})));
    etat.textContent='Terminé, rechargement…';
    setTimeout(()=>location.replace(location.pathname+'?maj='+Date.now()),400);
  }catch(e){etat.textContent='La mise à jour a échoué. Vérifiez votre connexion et réessayez.'}
};

save();render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
</script>
</body>
</html>
